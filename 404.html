<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Francisco Elis</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0a0f1d; --text: #f8fafc; --muted: #94a3b8; --faint: #475569;
    --line: rgba(255,255,255,0.08); --chip: rgba(15,23,42,0.8);
    --grad-a: #38bdf8; --grad-b: #6366f1; --grad-c: #a855f7;
    --ink: #06111f;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased;
    position: relative; overflow-x: clip;
    display: flex; align-items: center; justify-content: center; text-align: center;
    padding: 24px;
  }
  a { color: var(--grad-a); text-decoration: none; }
  .glow {
    position: absolute; top: -280px; left: 50%; width: 1100px; height: 760px;
    transform: translateX(-50%);
    background: radial-gradient(closest-side, rgba(56,189,248,0.16), rgba(99,102,241,0.08) 55%, transparent);
    filter: blur(10px); pointer-events: none;
  }
  .code {
    font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--faint); margin-bottom: 18px;
  }
  .num {
    font-size: clamp(72px, 16vw, 160px); font-weight: 800; letter-spacing: -0.04em; line-height: 1;
    background: linear-gradient(120deg, var(--grad-a) 0%, var(--grad-b) 45%, var(--grad-c) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  h1 {
    margin: 18px 0 10px; font-size: clamp(20px, 2.6vw, 28px); font-weight: 700; letter-spacing: -0.02em;
  }
  p { margin: 0 auto; max-width: 42ch; font-size: 14.5px; line-height: 1.7; color: var(--muted); }
  p + p { margin-top: 4px; }
  .btn {
    display: inline-flex; align-items: center; gap: 9px; margin-top: 30px; padding: 12px 22px;
    border-radius: 8px; border: 1px solid var(--line); background: var(--chip); color: var(--text);
    font-size: 14px; font-weight: 600; transition: all .2s ease;
  }
  .btn:hover { border-color: var(--grad-a); color: #7dd3fc; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div>
    <div class="code">// error</div>
    <div class="num">404</div>
    <h1>Francisco Elis</h1>
    <p>Esta página no existe o se movió de lugar.</p>
    <p>This page doesn't exist or has moved.</p>
    <a class="btn" href="./">&larr; Volver al portafolio / Back to portfolio</a>
  </div>
</body>
</html>
